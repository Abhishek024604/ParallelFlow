openapi: 3.1.0
info:
  title: ParallelFlow Platform API
  version: 2.0.0
  summary: REST API for the ParallelFlow MVP (Build Pack v2.0)
  description: 'Conventions: base URL https://api.parallelflow.app/v1 · session cookie (web) or Bearer token · UUIDv7 ids · cursor pagination · RFC 7807 errors with stable codes · Idempotency-Key on all creating/transition
    POSTs · If-Match on versioned PATCH · every operation documents its authorization rule in `x-required-permission` (see Build Pack doc 03). Org/unit dashboards return metadata only; Arena content requires
    project membership.'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: ParallelFlow Platform Team
servers:
- url: https://api.parallelflow.app/v1
- url: https://api.staging.parallelflow.app/v1
security:
- cookieAuth: []
- bearerAuth: []
tags:
- name: Arena
  description: One shared Arena (single stream, one agent session) per project
- name: Artifacts
  description: Versioned artifacts, uploads, Push to Arena
- name: Audit
  description: Audit log and exports
- name: Identity
  description: Login, session, profile
- name: Messaging
  description: Direct messages
- name: Notifications
  description: Notifications, preferences, realtime
- name: Organization
  description: Org settings, policies, members, invites, SSO, knowledge, usage
- name: Private
  description: Private space and the bridge
- name: Projects
  description: Projects, setup wizard, templates, capability catalogue
- name: Roles & access
  description: Custom roles, members, access requests, gates, agent autonomy
- name: Routines
  description: Scheduled AI routines
- name: SDLC loop
  description: Cycles, gates, approvals, evidence
- name: Search
  description: Permission-aware search
- name: Tasks
  description: Tasks, delegation, AI teammate assignment, verification
- name: Teams
  description: Self-governed teams
- name: Units
  description: Org hierarchy (BU/department/group) and unit roles
- name: Webhooks
  description: Inbound webhooks
paths:
  /me:
    get:
      tags:
      - Identity
      operationId: getMe
      summary: Current user, org memberships, unit roles, personal agent
      x-required-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - Identity
      operationId: updateMe
      summary: Update display name / handle
      x-required-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: Trimmed, 1–80 characters.
                handle:
                  type: string
                  description: Lower-cased, then `^[a-z0-9_-]{3,30}$`. Taken → 409 ALREADY_EXISTS.
  /auth/login:
    get:
      tags:
      - Identity
      operationId: login
      summary: 'Start login (redirects to WorkOS AuthKit: SSO, Google, Microsoft, magic link)'
      description: Sets the short-lived `parallelflow_login` cookie (state and PKCE verifier, encrypted, 10 min) and redirects to AuthKit. See ADR-032.
      x-required-permission: public
      parameters:
      - name: return_to
        in: query
        required: false
        description: Where the browser goes after a successful login. A relative path on the web app or an absolute URL on WEB_ORIGIN; anything else is ignored and the web app root is used.
        schema:
          type: string
          maxLength: 2048
      - name: screen
        in: query
        required: false
        description: Open AuthKit on its sign-up or sign-in screen. Other values are ignored.
        schema:
          type: string
          enum:
          - sign-up
          - sign-in
      - name: provider
        in: query
        required: false
        description: '`google` skips the AuthKit page and goes straight to Google. Other values are ignored.'
        schema:
          type: string
          enum:
          - google
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /auth/callback:
    get:
      tags:
      - Identity
      operationId: authCallback
      summary: OAuth callback; sets session cookie
      description: 'On success sets `parallelflow_session` and `parallelflow_csrf` and redirects to `return_to`. On failure redirects to the web app with `?auth_error=` one of `denied`, `invalid_state`, `invalid_code`, `email_unverified`, `account_deactivated`, and sets no session. See ADR-032.'
      x-required-permission: public
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /auth/logout:
    post:
      tags:
      - Identity
      operationId: logout
      summary: End session
      description: Requires `X-CSRF-Token`. Revokes the WorkOS session and clears `parallelflow_session` and `parallelflow_csrf`.
      x-required-permission: authenticated
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /arenas:
    get:
      tags:
      - Arena
      operationId: listArenas
      summary: Your arenas, with the active cycle and stage
      x-required-permission: authenticated (own memberships only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArenaSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Arena
      operationId: createArena
      summary: Create an arena and its invite links
      description: 'ADR-029. One transaction creates the hidden org, team, project, arena and AI session; the creator becomes the arena owner. Requires `X-CSRF-Token`. Each invite email gets a link `{WEB_ORIGIN}/join/{token}` (7 days, single use, for that email). Links are returned in this response only; an idempotent replay returns `link: null`.'
      x-required-permission: authenticated
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ArenaSummary'
                - type: object
                  properties:
                    invites:
                      type: array
                      items:
                        type: object
                        properties:
                          email:
                            type: string
                            format: email
                          link:
                            type:
                            - string
                            - 'null'
                            format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArena'
  /arenas/{arena_id}:
    get:
      tags:
      - Arena
      operationId: getArenaSummary
      summary: One arena you belong to; the owner also sees the invites sent (never the links)
      x-required-permission: project member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ArenaSummary'
                - type: object
                  properties:
                    invites:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          status:
                            type: string
                            enum:
                            - pending
                            - accepted
                            - revoked
                            - expired
                          expires_at:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: arena_id
        in: path
        required: true
        description: The arena's project id (`ArenaSummary.id`).
        schema:
          type: string
          format: uuid
    patch:
      tags:
      - Arena
      operationId: updateArena
      summary: Rename the arena or change its description (ADR-038)
      x-required-permission: role owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArena'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: arena_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
      - Arena
      operationId: deleteArena
      summary: Delete the arena (soft delete; it disappears for every member) (ADR-038)
      x-required-permission: role owner
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: arena_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /arenas/{arena_id}/archive:
    post:
      tags:
      - Arena
      operationId: archiveArena
      summary: Archive the arena (read-only until unarchived) (ADR-038)
      x-required-permission: role owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: arena_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /arenas/{arena_id}/unarchive:
    post:
      tags:
      - Arena
      operationId: unarchiveArena
      summary: Unarchive the arena (ADR-038)
      x-required-permission: role owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: arena_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /orgs:
    post:
      tags:
      - Organization
      operationId: createOrg
      summary: Create an organization (creator becomes Org Owner) with a preset
      x-required-permission: authenticated
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrg'
  /orgs/{org_id}:
    get:
      tags:
      - Organization
      operationId: getOrg
      summary: Organization details
      x-required-permission: org member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
    patch:
      tags:
      - Organization
      operationId: updateOrg
      summary: Rename, unit level names
      x-required-permission: org:owner|admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                unit_level_names:
                  type: array
                  items:
                    type: string
  /orgs/{org_id}/policies:
    get:
      tags:
      - Organization
      operationId: getOrgPolicies
      summary: Org policies
      x-required-permission: org:owner|admin|security_admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgPolicies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
    put:
      tags:
      - Organization
      operationId: putOrgPolicies
      summary: Update org policies (security fields require security_admin or owner)
      x-required-permission: org:owner|admin|security_admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgPolicies'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgPolicies'
  /orgs/{org_id}/members:
    get:
      tags:
      - Organization
      operationId: listOrgMembers
      summary: Directory (guests see only co-members)
      x-required-permission: org member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrgMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
      - &id002
        $ref: '#/components/parameters/Limit'
      - &id003
        $ref: '#/components/parameters/Cursor'
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: unit_id
        in: query
        required: false
        schema: *id001
      - name: role
        in: query
        required: false
        schema:
          type: string
  /orgs/{org_id}/members/{user_id}:
    patch:
      tags:
      - Organization
      operationId: updateOrgMember
      summary: Change org role, home unit, title, level, guest expiry
      x-required-permission: org:owner|admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
      - name: user_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgMember'
    delete:
      tags:
      - Organization
      operationId: offboardMember
      summary: 'Offboard: revoke sessions, remove from teams/projects, schedule Private retention'
      x-required-permission: org:owner|admin
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
      - name: user_id
        in: path
        required: true
        schema: *id001
  /orgs/{org_id}/invites:
    get:
      tags:
      - Organization
      operationId: listInvites
      summary: Pending invites
      x-required-permission: org:owner|admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
      - *id002
      - *id003
    post:
      tags:
      - Organization
      operationId: createInvites
      summary: Invite people to org / team / project (guests need guest_access_until)
      x-required-permission: org:owner|admin OR team:owner|admin (team scope) OR cap member.invite (project scope)
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvites'
  /orgs/{org_id}/invites/{invite_id}:
    delete:
      tags:
      - Organization
      operationId: revokeInvite
      summary: Revoke invite
      x-required-permission: inviter OR org:owner|admin
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
      - name: invite_id
        in: path
        required: true
        schema: *id001
  /invites/{token}:accept:
    post:
      tags:
      - Organization
      operationId: acceptInvite
      summary: Accept an invite
      description: Requires `X-CSRF-Token`. The invite must be pending, unexpired and for the caller's account email (else 403 `FORBIDDEN`). Single use; unknown, expired or used tokens answer 410 `INVITE_EXPIRED`. Returns your profile plus the arena you joined.
      x-required-permission: authenticated (email must match)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Me'
                - type: object
                  properties:
                    arena:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
  /invites/{token}:
    get:
      tags:
      - Organization
      operationId: getInvite
      summary: What an invite link is for (join page)
      description: 'Public and rate-limited per arena. `token` is the last path segment of the link. Unknown, expired, revoked and used tokens all answer 410 `INVITE_EXPIRED`. The invited email is masked unless the viewer is signed in with that email.'
      x-required-permission: public (token)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      security: []
  /orgs/{org_id}/sso:
    get:
      tags:
      - Organization
      operationId: getSso
      summary: SSO / SCIM status and WorkOS admin-portal link
      x-required-permission: org:owner|admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
  /orgs/{org_id}/sso:portal-link:
    post:
      tags:
      - Organization
      operationId: ssoPortalLink
      summary: Generate WorkOS admin-portal link to configure SAML/OIDC/SCIM
      x-required-permission: org:owner|admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
        in: path
        required: true
        schema: *id001
  /orgs/{org_id}/units:
    get:
      tags:
      - Units
      operationId: listUnits
      summary: Org unit tree
      x-required-permission: org member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Unit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: org_id
