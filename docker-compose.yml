# Local services for `pnpm dev` (doc 11 §11.1). Images match packages/testing.
name: saras

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: saras
      POSTGRES_USER: saras
      POSTGRES_PASSWORD: saras
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saras -d saras']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: saras
      MINIO_ROOT_PASSWORD: saras-minio
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['1025:1025', '8025:8025']

  # The agent runtime (apps/runtime, ADR-035) and App Tools run on the host via `pnpm dev`.

volumes:
  pgdata:
  miniodata:
