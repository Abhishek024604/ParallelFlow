  /webhooks/github:
    post:
      tags:
      - Webhooks
      operationId: githubWebhook
      summary: GitHub App events (push, PR, check runs) for evidence; HMAC verified
      x-required-permission: public (signed)
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: parallelflow_session
      description: Web session (WorkOS AuthKit, ADR-032). HttpOnly, SameSite=Lax, Secure; 12 h absolute, 2 h idle. POST, PUT, PATCH and DELETE also need the `X-CSRF-Token` header, equal to the `parallelflow_csrf` cookie, else 403 FORBIDDEN.
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not permitted (see required_permission)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict / guard failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Version mismatch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Domain rule violated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate or budget limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine code, see API reference §7.4
        detail:
          type: string
        request_id:
          type: string
        required_permission:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      - code
    PageMeta:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
    Actor:
      type: object
      properties:
        type:
          type: string
          enum:
          - user
          - agent
          - system
        id: *id001
        display_name:
          type: string
        on_behalf_of:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - type
      - id
    ResourceRef:
      type: object
      properties:
        type:
          type: string
          enum:
          - project
          - task
          - cycle
          - artifact
          - message
          - approval
          - routine
          - access_request
          - dm
        id: *id001
      required:
      - type
      - id
    Me:
      type: object
      properties:
        id: *id001
        email:
          type: string
          format: email
        display_name:
          type: string
        handle:
          type: string
        orgs:
          type: array
          items:
            type: object
            properties:
              org:
                $ref: '#/components/schemas/Organization'
              role:
                $ref: '#/components/schemas/OrgRole'
              status:
                type: string
              expires_at:
                type:
                - string
                - 'null'
                format: date-time
        unit_roles:
          type: array
          items:
            type: object
            properties:
              unit_id: *id001
              role:
                type: string
                enum:
                - unit_lead
                - unit_admin
        personal_agent:
          $ref: '#/components/schemas/Agent'
    OrgRole:
      type: string
      enum:
      - owner
      - admin
      - security_admin
      - billing_admin
      - member
      - guest
    Organization:
      type: object
      properties:
        id: *id001
        slug:
          type: string
        name:
          type: string
        preset:
          type: string
          enum:
          - startup
          - enterprise
        unit_level_names:
          type: array
          items:
            type: string
        data_region:
          type: string
        sso_enabled:
          type: boolean
        created_at: *id004
    CreateOrg:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9-]{3,40}$
        preset:
          type: string
          enum:
          - startup
          - enterprise
      required:
      - name
      - slug
      - preset
    OrgPolicies:
      type: object
      properties:
        require_sso:
          type: boolean
        member_team_creation:
          type: string
          enum:
          - members
          - unit_admins
          - org_admins
        allow_cross_unit_projects:
          type: boolean
        guest_default_expiry_days:
          type: integer
          minimum: 1
          maximum: 365
        agent_max_autonomy:
          $ref: '#/components/schemas/Autonomy'
        allowed_model_classes:
          type: array
          items:
            type: string
            enum:
            - fast
            - balanced
            - deep
        private_retention_days_after_leave:
          type: integer
        project_member_limit:
          type: integer
    Autonomy:
      type: string
      enum:
      - 'off'
      - suggest
      - approve
      - act
    OrgMember:
      type: object
      properties:
        user_id: *id001
        display_name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
        status:
          type: string
          enum:
          - invited
          - active
          - suspended
          - deprovisioned
        home_unit_id:
          type:
          - string
          - 'null'
          format: uuid
        job_title:
          type:
          - string
          - 'null'
        level:
          type:
          - string
          - 'null'
        reports_to:
          type:
          - string
          - 'null'
          format: uuid
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        presence:
          type: string
          enum:
          - online
          - offline
        last_active_at:
          type:
          - string
          - 'null'
          format: date-time
    UpdateOrgMember:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/OrgRole'
        home_unit_id:
          type:
          - string
          - 'null'
          format: uuid
        job_title:
          type: string
        level:
          type: string
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    ArenaSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The arena's project id.
        arena_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        key:
          type: string
          description: 2–4 upper-case letters.
        cycle:
          type:
          - integer
          - 'null'
        stage:
          type:
          - string
          - 'null'
          enum:
          - PLAN
          - DESIGN
          - BUILD
          - TEST
          - DEPLOY
          - MAINTAIN
          - null
        member_count:
          type: integer
        role:
          type: string
          enum:
          - owner
          - member
        archived:
          type: boolean
          description: Archived arenas are read-only until the owner unarchives them.
    UpdateArena:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type:
          - string
          - 'null'
          maxLength: 500
    CreateArena:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed.
        description:
          type: string
          maxLength: 500
        invite_emails:
          type: array
          maxItems: 20
          description: Lower-cased and de-duplicated; the creator's own email is dropped.
          items:
            type: string
            format: email
    InvitePreview:
      type: object
      properties:
        arena:
          type: object
          properties:
            name:
              type: string
            description:
              type:
              - string
              - 'null'
            member_count:
              type: integer
            member_initials:
              type: array
              maxItems: 4
              items:
                type: string
        invited_by:
          type: object
          properties:
            display_name:
              type: string
        email:
          type: string
          description: Masked (e.g. `r***@example.com`) unless the viewer is signed in with this email.
        email_matches:
          type:
          - boolean
          - 'null'
          description: null when the viewer is not signed in.
        expires_at:
          type: string
          format: date-time
    Invite:
      type: object
      properties:
        id: *id001
        email:
          type: string
        scope:
          type: string
          enum:
          - org
          - team
          - project
        org_role:
          $ref: '#/components/schemas/OrgRole'
        team_id:
          type:
          - string
          - 'null'
          format: uuid
        project_id:
          type:
          - string
          - 'null'
          format: uuid
        project_role_ids:
          type: array
          items: *id001
        guest_access_until:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
        expires_at: *id004
    CreateInvites:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
        org_role:
          $ref: '#/components/schemas/OrgRole'
        team_id: *id001
        project_id: *id001
        project_role_ids:
          type: array
          items: *id001
        guest_access_until: *id004
        message:
          type: string
      required:
      - emails
    Unit:
      type: object
      properties:
        id: *id001
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
        depth:
          type: integer
        path:
          type: string
        leads:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
        admins:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
        team_count:
          type: integer
        member_count:
          type: integer
        policy_overrides:
          type: object
    CreateUnit:
      type: object
      properties:
        name:
          type: string
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - name
    UnitRoles:
      type: object
      properties:
        leads:
          type: array
          items: *id001
