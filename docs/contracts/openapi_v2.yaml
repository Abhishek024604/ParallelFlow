  /projects/{project_id}/arena/messages:
    get:
      tags:
      - Arena
      operationId: listArenaMessages
      summary: Arena messages (single stream, threads via parent_id)
      description: Items are oldest to newest. Without a cursor, the latest page. With `cursor`
        (a `next_cursor`), the page before it. With `after` (a `latest_cursor`), only newer messages,
        oldest first, for polling. Soft-deleted messages are left out.
      x-required-permission: cap arena.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Message'
                    latest_cursor:
                      description: Pass as `after` to poll for newer messages. Null while the arena
                        has none, and on older pages.
                      type:
                      - string
                      - 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: project_id
        in: path
        required: true
        schema: *id001
      - *id002
      - *id003
      - name: parent_id
        in: query
        required: false
        schema: *id001
      - name: after
        in: query
        required: false
        description: Opaque cursor (`latest_cursor`). Not combined with `cursor`.
        schema:
          type: string
    post:
      tags:
      - Arena
      operationId: postArenaMessage
      summary: Post; @central starts a turn; @user/@role notify
      x-required-permission: cap arena.post (+agent.invoke for @central, +arena.tag_roles for @role)
